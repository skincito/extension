<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Skincito · Aprobar entrega</title>
<style>
:root{--bg:#15171c;--panel:#1e2128;--line:#2c3039;--text:#eef1f5;--muted:#8f98a0;--accent:#3b82f6;--ok:#a4d007;--bad:#ff6b6b;--warn:#ffd56a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font:700 16px Arial,sans-serif}
header h1{margin:0;font-size:14px;font-weight:600;flex:1}
header small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.origin{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow:auto;padding:18px 16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h2{margin:4px 0 14px;font-size:20px;line-height:1.25}
.item{background:var(--panel);border-radius:10px;padding:14px}
.item .name{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.item .asset{color:var(--muted);font-size:12px;margin-top:2px}
.route{margin-top:12px;background:var(--panel);border-radius:10px}
.route .row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px}
.route .row+.row{border-top:1px solid var(--line)}
.route .row span{color:var(--muted)}
.route .row b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.route a{color:var(--text);text-decoration:none}
.route a:hover{text-decoration:underline}
ul{margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:12px}
li{display:flex;gap:8px;margin-top:6px}
li::before{content:"✓";color:var(--ok);flex:none}
.notice{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:12px;white-space:pre-line;overflow-wrap:anywhere}
.notice.warning{background:rgba(255,213,106,.1);color:var(--warn)}
.notice.error{background:rgba(255,107,107,.12);color:var(--bad)}
.notice.success{background:rgba(164,208,7,.12);color:var(--ok)}
.notice:empty{display:none}
.center{text-align:center;color:var(--muted);padding:60px 10px}
footer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
footer button{flex:1;border:0;border-radius:999px;padding:11px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}
#reject{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#reject:hover{background:rgba(59,130,246,.12)}
#approve{background:var(--accent);color:#fff}
#approve:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
[hidden]{display:none!important}
.waiting{margin-bottom:14px;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:10px;background:rgba(59,130,246,.1)}
.waiting b{display:block;font-size:14px}
.waiting p{margin:4px 0 0;color:var(--muted);font-size:12px}
.spinner{flex:none;width:22px;height:22px;border-radius:50%;border:3px solid rgba(59,130,246,.25);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <h1>Skincito<small>Trade Assistant</small></h1>
  <div class="origin" id="origin"></div>
</header>
<main>
  <div id="loading" class="center">Preparando el pedido…</div>
  <!-- Publicado en Steam, falta confirmarlo en la app: approve.ts lo muestra arriba de todo hasta que aparece activa. -->
  <div class="waiting" id="waiting" hidden role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div><b>Confirmá la publicación en la app de Steam</b><p id="waitingText"></p></div>
  </div>
  <!-- Entrega, publicación o compra en el market: approve.ts completa el texto según el pedido. -->
  <section id="request" hidden>
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <div class="item"><div class="name" id="item"></div><div class="asset" id="asset"></div></div>
    <div class="route" id="rows"></div>
    <ul id="bullets"></ul>
  </section>
  <div class="notice" id="notice"></div>
</main>
<footer>
  <button id="reject">Rechazar</button>
  <button id="approve" disabled>Aprobar</button>
</footer>
<script src="approve.js"></script>
</body>
</html>
